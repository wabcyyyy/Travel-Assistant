name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-agent-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install fastapi==0.111.0 "uvicorn[standard]==0.30.1" pydantic==2.8.2 \
            httpx==0.27.0 "mcp>=1.10,<2" python-dotenv==1.0.1 langgraph==0.2.44 \
            langchain-core==0.3.15 pymysql==1.2.0 chromadb==1.5.9 pytest==8.2.2
      - name: Offline unit tests
        env:
          # 单测不依赖真实密钥
          AGENT_INTERNAL_TOKEN: ''
          LLM_API_KEY: ''
        run: pytest tests/ --ignore=tests/api --ignore=tests/perf --ignore=tests/agent_eval -q
      - name: Compose config
        working-directory: .
        run: docker compose config -q

  java-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit tests
        run: mvn -B "-Dtest=DistributedStateServiceTest,SimpleCircuitBreakerTest,TokenRevocationServiceTest,BudgetEngineImplTest,ItineraryStatusRecoveryTest,ItineraryDayPersistenceServiceTest,ItineraryAsyncPlannerTest" test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan trackable sources for secrets
        shell: pwsh
        run: |
          ./scripts/check-secrets.ps1
