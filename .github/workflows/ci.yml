name: ci

on:
  push:
    branches: [master, main]
  pull_request:

# 同分支新 push 自动取消旧 run（G-0.4）：省 CI 分钟数，也避免旧结论覆盖新推送
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    # 便宜门禁先行（G-0.4）：与本地 travel-agent-python/scripts/check.ps1 同序同果。
    # lint / typecheck / secret-scan 任何一项红，测试与构建 job 直接不开跑。
    # import-linter 在 G-1.2 落地后并入本 job。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-agent-python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Sync deps (lockfile-driven)
        # 依赖一律由 uv.lock 驱动，禁止手写 pin 列表：此前 CI 装 chromadb、
        # 运行时用 qdrant-client 的漂移即由此而来
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format --check
        run: uv run ruff format --check .
      - name: Typecheck (pyright baseline ratchet)
        # 存量报错冻结在 pyright-baseline.txt，新增即红；本地入口 scripts/typecheck.ps1
        run: uv run python scripts/typecheck.py
      - name: Secret scan
        working-directory: .
        shell: pwsh
        run: ./scripts/check-secrets.ps1

  python-agent:
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-agent-python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Sync deps (lockfile-driven)
        run: uv sync --frozen
      - name: Offline unit tests
        env:
          # 单测不依赖真实密钥；固定 hashed 向量（零模型加载，离线确定性）
          AGENT_INTERNAL_TOKEN: ''
          LLM_API_KEY: ''
          RAG_EMBEDDING_PROVIDER: hashed
        run: uv run pytest tests/ --ignore=tests/api --ignore=tests/perf --ignore=tests/agent_eval -q
      - name: Contract schema drift check
        # 契约唯一源是 app/schemas/**（登记表 app/schemas/contracts.py）；入仓导出物
        # （事件/分组 schema + openapi.json + 前端生成类型）与模型不同步即红
        env:
          RAG_EMBEDDING_PROVIDER: hashed
        run: |
          uv run python scripts/export_contracts.py
          git diff --exit-code -- ../contracts/ ../travel-frontend-vue/src/types/generated/
      - name: Endpoint coverage gate
        # Java 退役后报告「已归档且无残留登记」：残留端点必须逐条登记在 EXPECTED_REMAINING
        run: uv run python scripts/check_endpoint_coverage.py
      - name: Compose config
        working-directory: .
        run: docker compose config -q

  frontend:
    needs: preflight
    # 前端门禁：类型检查 + 生产构建 + 纯逻辑单测（store reducer / SSE 帧解析）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: travel-frontend-vue/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type check & build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Theme lint
        # 外观契约门禁（SPEC v2.3 §7.1.6）：裸色值 / z-index 字面量 / !important；
        # 旧文件走 scripts/theme-lint.allowlist.json，只准变短不准变长
        run: npm run theme:lint
      - name: EP allowlist
        # 去 EP 门禁（SPEC v2.6 §19.7-2）：产品面禁止新增 Element Plus 使用；
        # 存量走 scripts/ep-allowlist.json，总数只减不增
        run: npm run ep:lint

  schema-migration:
    needs: preflight
    # 迁移门禁：按版本序把全部迁移 SQL（当前 V1、V2）应用到空库，验证「新环境可复现正确 schema」
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: travel_assistant
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pci-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Apply all migrations in version order (V1 → V2 → …)
        env:
          MYSQL_PWD: ci-only-password
        run: |
          # 版本序而非字典序：V10 必须排在 V2 之后（`sort -V` 按版本号）
          for f in $(ls -1 travel-agent-python/app/db/migrations/sql/V*.sql | sort -V); do
            echo "applying $f"
            mysql -h127.0.0.1 -uroot travel_assistant < "$f"
          done
          tables=$(mysql -h127.0.0.1 -uroot -N -B travel_assistant \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='travel_assistant'")
          echo "created tables: $tables"
          test "$tables" -ge 13
          # 采集管线依赖的关键列必须存在（fail-fast 契约）
          mysql -h127.0.0.1 -uroot -N -B travel_assistant \
            -e "SHOW COLUMNS FROM poi_knowledge LIKE 'avg_cost'" | grep -q avg_cost
          # V2 列/表断言：清单只增不减，防「迁移漏跑」
          mysql -h127.0.0.1 -uroot -N -B travel_assistant \
            -e "SHOW COLUMNS FROM itinerary_main LIKE 'cover_url'" | grep -q cover_url
          mysql -h127.0.0.1 -uroot -N -B travel_assistant \
            -e "SHOW COLUMNS FROM itinerary_main LIKE 'share_token'" | grep -q share_token
          mysql -h127.0.0.1 -uroot -N -B travel_assistant \
            -e "SHOW TABLES LIKE 'city_geo'" | grep -q city_geo
      - name: Cross-check schema contract (Python 只读列 vs 全部迁移)
        # 防 schema 漂移：迁移文件（V1+V*）必须覆盖查询用到的全部列（纯静态，无需 DB）
        run: python3 travel-agent-python/scripts/check_schema_contract.py
