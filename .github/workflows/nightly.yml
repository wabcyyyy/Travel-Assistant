name: nightly

# 分层冒烟（评审报告 §4.2）：PR 层在 ci.yml；夜间跑
#   1) 语义检索评测：验证默认 semantic 路径（模型走 HF 镜像 + 缓存）；
#   2) 集成冒烟：起 MySQL/Redis + Agent + Java（Java 首启即执行 Flyway 迁移），
#      再跑 tests/api 端到端（真实 LLM 生成，需 LLM_API_KEY secret，缺失时跳过）。
# 手动触发：Actions → nightly → Run workflow。

on:
  schedule:
    - cron: '0 18 * * *' # 02:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval-semantic:
    name: Retrieval eval (semantic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-agent-python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Sync deps (lockfile-driven)
        run: uv sync --frozen
      - name: Cache RAG embedding model
        uses: actions/cache@v4
        with:
          path: travel-agent-python/models
          key: rag-model-bge-small-zh-v1.5
      - name: Fetch RAG model (HF mirror)
        env:
          HF_ENDPOINT: https://hf-mirror.com
        run: uv run python scripts/fetch_rag_model.py
      - name: Hashed baseline
        run: uv run python tests/agent_eval/eval_retrieval.py --provider hashed | tee hashed.json
      - name: Semantic eval
        run: uv run python tests/agent_eval/eval_retrieval.py --provider semantic | tee semantic.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: |
            travel-agent-python/hashed.json
            travel-agent-python/semantic.json

  integration-smoke:
    name: Integration smoke (tests/api)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: travel_assistant
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pci-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Guard (require LLM_API_KEY)
        id: guard
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 LLM_API_KEY secret，跳过集成冒烟（tests/api 需要真实生成）"
          fi
      - uses: astral-sh/setup-uv@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-java@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install python deps
        if: steps.guard.outputs.skip != 'true'
        working-directory: travel-agent-python
        run: uv sync --frozen
      - name: Start agent (hashed 向量：零模型下载)
        if: steps.guard.outputs.skip != 'true'
        working-directory: travel-agent-python
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DB_HOST: 127.0.0.1
          DB_PASSWORD: ci-only-password
          DB_NAME: travel_assistant
          REDIS_URL: redis://127.0.0.1:6379/0
          RAG_EMBEDDING_PROVIDER: hashed
          AGENT_INTERNAL_TOKEN: ci-internal-token
        run: |
          nohup uv run python main.py > /tmp/agent.log 2>&1 &
      - name: Start backend (首启执行 Flyway 迁移)
        if: steps.guard.outputs.skip != 'true'
        working-directory: travel-backend-java
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-only-password
          MYSQL_DB: travel_assistant
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          JWT_SECRET: ci-example-jwt-secret-at-least-32-chars
          AGENT_SERVICE_URL: http://127.0.0.1:8000
          AGENT_INTERNAL_TOKEN: ci-internal-token
        run: |
          nohup mvn -B -q spring-boot:run > /tmp/backend.log 2>&1 &
      - name: Wait for services
        if: steps.guard.outputs.skip != 'true'
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/agent/health >/dev/null && break || sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/agent/health
          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:8080/api/test/hello >/dev/null && break || sleep 2
          done
          curl -sf http://127.0.0.1:8080/api/test/hello
      - name: pytest tests/api
        if: steps.guard.outputs.skip != 'true'
        working-directory: travel-agent-python
        env:
          API_BASE_URL: http://127.0.0.1:8080
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: uv run pytest tests/api -q
      - name: Real-LLM eval（小样本 + 成本上限 3 例）
        if: steps.guard.outputs.skip != 'true'
        working-directory: travel-agent-python
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DB_HOST: 127.0.0.1
          DB_PASSWORD: ci-only-password
          DB_NAME: travel_assistant
          REDIS_URL: redis://127.0.0.1:6379/0
          RAG_EMBEDDING_PROVIDER: hashed
        run: uv run python tests/agent_eval/llm_eval.py --limit 3 | tee llm_eval_small.json
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          name: nightly-eval
          path: |
            travel-agent-python/llm_eval_small.json
            travel-agent-python/tests/agent_eval/report
      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== agent.log (tail) ==="; tail -200 /tmp/agent.log || true
          echo "=== backend.log (tail) ==="; tail -200 /tmp/backend.log || true
