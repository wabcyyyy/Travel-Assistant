name: nightly

# 分层冒烟（评审报告 §4.2）：PR 层在 ci.yml；夜间跑集成冒烟：
# 起 MySQL/Redis + FastAPI 后端（首启即自动迁移 schema），再跑 tests/api
# 端到端（真实 LLM 生成，需 LLM_API_KEY secret，缺失时跳过）。
# （语义检索评测已随 RAG 退役整体删除。）
# 手动触发：Actions → nightly → Run workflow。

on:
  schedule:
    - cron: '0 18 * * *' # 02:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-smoke:
    name: Integration smoke (tests/api)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: travel_assistant
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pci-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Guard (require LLM_API_KEY)
        id: guard
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 LLM_API_KEY secret，跳过集成冒烟（tests/api 需要真实生成）"
          fi
      - uses: astral-sh/setup-uv@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install python deps
        if: steps.guard.outputs.skip != 'true'
        working-directory: travel-agent-python
        run: uv sync --frozen
      - name: Start agent (hashed 向量：零模型下载)
        if: steps.guard.outputs.skip != 'true'
        working-directory: travel-agent-python
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DB_HOST: 127.0.0.1
          DB_PASSWORD: ci-only-password
          DB_NAME: travel_assistant
          REDIS_URL: redis://127.0.0.1:6379/0
          AGENT_INTERNAL_TOKEN: ci-internal-token
          # 本进程自己签发会话票：必须显式给 JWT_SECRET（≥32 字符），不能依赖空默认值
          JWT_SECRET: ci-example-jwt-secret-at-least-32-chars
        run: |
          nohup uv run python main.py > /tmp/agent.log 2>&1 &
      - name: Wait for services
        if: steps.guard.outputs.skip != 'true'
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/agent/health >/dev/null && break || sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/agent/health
          # 后端已统一到 FastAPI：这一步同时验证「空库启动即迁移」（Java 退役后没有 Flyway 了）
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/test/hello >/dev/null && break || sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/test/hello
      - name: pytest tests/api
        if: steps.guard.outputs.skip != 'true'
        working-directory: travel-agent-python
        env:
          API_BASE_URL: http://127.0.0.1:8000
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: uv run pytest tests/api -q
      - name: Real-LLM eval（小样本 3 例 + 防倒退门禁）
        if: steps.guard.outputs.skip != 'true'
        working-directory: travel-agent-python
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DB_HOST: 127.0.0.1
          DB_PASSWORD: ci-only-password
          DB_NAME: travel_assistant
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          uv run python tests/agent_eval/llm_eval.py --path stream --limit 3 | tee llm_eval_small.json
          # 防倒退门禁（SPEC v2.3 §8 A2）：failed run / Prompt 或生成路径漂移 / 一致率低于基线 → 红；
          # degraded 如实呈现，不判失败。--path stream 是刻意的：量产品实际走的逐日流式，
          # 同步 /v1/generate 那条共用预算的遗留面用 `--path graph` 单独测。
          uv run python tests/agent_eval/eval_gate.py
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          name: nightly-eval
          path: |
            travel-agent-python/llm_eval_small.json
            travel-agent-python/tests/agent_eval/report
      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== agent.log (tail) ==="; tail -200 /tmp/agent.log || true
