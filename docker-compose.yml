# 本地/演示编排：基础设施一键起，应用可继续用 start-all 或 profile 拉起。
# 用法：
#   docker compose up -d mysql redis
#   docker compose --profile apps up -d   # 可选：容器化三端（需先构建镜像）
#
# 默认仅起 MySQL + Redis，避免与宿主机已占用端口冲突时难排查。

name: travel-assistant

services:
  mysql:
    image: mysql:8.0
    container_name: ta-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-travel_dev_only}
      MYSQL_DATABASE: ${MYSQL_DB:-travel_assistant}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ta-mysql-data:/var/lib/mysql
      # 表结构由 Java 后端启动时的 Flyway 迁移创建（见 travel-backend-java/src/main/resources/db/migration/），
      # 不需要挂载初始化 SQL；如需兜底种子，后端建表后手工导入 sql/seed_data.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-travel_dev_only}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ta-redis
    ports:
      # 默认与项目 start-all 使用的 6380 对齐，避免与本机已有 6379 冲突
      - "${REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "no"]
    volumes:
      - ta-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 向量数据库（RAG 检索）：默认 Agent 用本地嵌入式模式即可起跑；
  # 配置 QDRANT_URL=http://qdrant:6333 后切到本服务（持久化 + 多实例共享）。
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ta-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - ta-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- 应用层（可选 profile）----
  # 镜像需自行 build；模型/密钥通过 .env 注入。未开启 apps profile 时不会启动。

  agent-python:
    profiles: ["apps"]
    build:
      context: ./travel-agent-python
      dockerfile: Dockerfile
    container_name: ta-agent
    env_file:
      - ./travel-agent-python/.env
    environment:
      AGENT_HOST: 0.0.0.0
      DB_HOST: mysql
      REDIS_HOST: redis
      # 容器网络内 Redis 监听 6379（宿主机才映射为 6380）
      REDIS_PORT: "6379"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/agent/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  backend-java:
    profiles: ["apps"]
    build:
      # 上下文必须是仓库根：镜像内需要 contracts/（跨语言流事件 schema，
      # 由 maven-resources-plugin 从 ../contracts 拷入 classpath）
      context: .
      dockerfile: travel-backend-java/Dockerfile
    container_name: ta-backend
    env_file:
      - ./travel-backend-java/.env
    environment:
      SERVER_ADDRESS: 0.0.0.0
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      # 容器网络内 Redis 监听 6379（宿主机才映射为 6380）
      REDIS_PORT: "6379"
      AGENT_SERVICE_URL: http://agent-python:8000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-python:
        condition: service_started
    restart: unless-stopped

  frontend-vue:
    profiles: ["apps"]
    build:
      context: ./travel-frontend-vue
      dockerfile: Dockerfile
    container_name: ta-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend-java
    restart: unless-stopped

volumes:
  ta-mysql-data:
  ta-redis-data:
  ta-qdrant-data:
