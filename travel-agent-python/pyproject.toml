[project]
name = "travel-agent-python"
version = "0.1.0"
description = "AI Agent service for Travel Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.8.2",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "langgraph==0.2.44",
    "langchain-core==0.3.15",
    "pymysql==1.2.0",
]

[project.optional-dependencies]
rag = [
    "chromadb==0.5.5",
]

[dependency-groups]
dev = [
    "pytest==8.2.2",
]

[tool.uv]
package = false