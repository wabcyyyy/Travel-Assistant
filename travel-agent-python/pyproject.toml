[project]
name = "travel-agent-python"
version = "0.1.0"
description = "AI Agent service for Travel Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.8.2",
    "httpx==0.27.0",
    "mcp>=1.10,<2",
    "python-dotenv==1.0.1",
    "langgraph==0.2.44",
    "langchain-core==0.3.15",
    "pymysql==1.2.0",
    "qdrant-client>=1.10,<2",
    "redis>=5.2,<6",
    # RAG 语义默认依赖（默认 RAG_EMBEDDING_PROVIDER=semantic，模型需 fetch_rag_model.py 预置）
    "sentence-transformers>=3.0,<6",
    # 后端迁移基座（PLAN v3.0）：SQLAlchemy 2 承载业务层数据访问；Alembic 以
    # op.execute() 原样包裹既有 db/migration/V*.sql（迁移文件不重写，保住
    # 「V1 一经发布不得修改」纪律，只换执行器）；bcrypt 校验 Java
    # BCryptPasswordEncoder 写入的既有口令哈希（$2a$ 前缀两侧互认）。
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "bcrypt>=4,<6",
    # PDF 导出（M6）：reportlab 直接排版印刷版行程单。候选里只有它同时满足
    # 「纯 Python（本机 Windows 与 CI 同一套 wheel）」和「表格边框合并 + 日块不跨页」：
    # xhtml2pdf 实测自己声明忽略 border-collapse / border-radius / page-break-inside，
    # 而这三条正是这份印刷稿的骨架；WeasyPrint 全都支持，却要 Pango/Cairo 原生库，
    # 等于把「导出 PDF」这条 demo 链路做成只能在 Linux 跑。
    "reportlab>=4.1,<5",
    # 封面图压缩（SPEC v2.3 S0-14）：长边缩放 + JPEG 重编码。此前仅经 reportlab
    # 传递进锁；显式列为直接依赖，避免 reportlab 升级/替换时被连带移除。
    "pillow>=10,<13",
    # torch 显式列为直接依赖：tool.uv.sources 只对直接依赖生效，
    # 否则传递依赖会从 PyPI 解析出带 CUDA 的 Linux 构建（数 GB）
    "torch",
    "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pyright>=1.1.414",
    "pytest==8.2.2",
    "ruff>=0.16.7",
]

[tool.ruff]
# 行宽实测分布 P90=75 / P95=86 / P99=103（38,794 行）：120 让中文注释几乎不断行，
# one-shot format 只重排代码长尾；>120 的行（20 行）一次性收敛后由 E501 拦住增量。
line-length = 120
target-version = "py312"
extend-exclude = ["scripts/archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # FastAPI 惯用法：Depends(...) 出现在参数默认值里（app/api/** 全部路由签名）。
    "B008",
    # 中文项目的假阳性：注释/文档字符串/字符串里的全角标点（，、（）等）是正确写法，
    # RUF001-003 的同形字检查在这里只产生噪音（实测 6,200+ 条，无一是真同形字）。
    "RUF001",
    "RUF002",
    "RUF003",
    # PEP 695 泛型语法（class C[T]）需 pydantic >= 2.9 才被完整支持；当前钉在 2.8.2，
    # 升级 pydantic 后移除此豁免（共 2 处：schemas/common.ApiResponse、services/itinerary_city）。
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# 测试里断言内联、嵌套容器字面量是常态；只保留正确性类规则。
"tests/*" = ["SIM117", "RUF012", "RUF001", "RUF002", "RUF003"]
# agent_eval 的评测/回放脚本先做 sys.path 注入再 import app（同 enrich_pois 模式），E402 是既定结构。
"tests/agent_eval/*" = ["E402"]
# chat_draft 门面：显式 re-export 旧导入路径（docstring 有说明），G-1.2 边界收敛时统一处理。
"app/agent/chat_draft/__init__.py" = ["F401"]

[tool.pyright]
include = ["app", "tests", "scripts", "main.py"]
exclude = ["**/__pycache__", "**/.venv*", "scripts/archive", ".pytest_tmp", ".tmp_*"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
# torch/sentence-transformers 等缺 stub 的第三方：存在性交给运行时，类型层面不拦。
reportMissingTypeStubs = "none"

# torch 走 CPU 源：默认 PyPI 的 Linux 构建会带入 nvidia-* CUDA 依赖（数 GB），
# 本项目只做 CPU 推理（CI / 镜像体积敏感）。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# import-linter（G-1.2）：架构边界机检。
# 契约 1 分层：api -> services -> agent，禁反向/跨层；
# 契约 2 门面：api/services 只准 import app.agent 门面（app/agent/__init__.py），
# 深路径进入 agent 子模块一律红。新增 agent 子模块时必须登记进 forbidden_modules。
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layering: api -> services -> agent"
type = "layers"
layers = ["app.api", "app.services", "app.agent"]

[[tool.importlinter.contracts]]
name = "Agent facade: api/services import app.agent only, never agent internals"
type = "forbidden"
source_modules = ["app.api", "app.services"]
# 只拦直接 import（as_packages 默认语义会把「import app.agent 门面」也视作 import
# 其全部子模块；allow_indirect_imports 切到直接依赖判定，恰好匹配"零深路径"门禁：
# 深路径一定是直接 import；经 services 转手的间接链由 services 自身的直接 import 拦下。
allow_indirect_imports = true
# 豁免：门面 re-export 名与子模块同名的固有解析歧义（实际经 app/agent/__init__.py
# 转发，非深路径）。unmatched_ignore_imports_alerting 默认 error：改名不删豁免会红。
ignore_imports = [
    "app.api.agent -> app.agent.usage_store",
    "app.services.admin_service -> app.agent.usage_store",
    "app.services.poi_search -> app.agent.poi_repository",
]
forbidden_modules = [
    "app.agent.butler",
    "app.agent.budget",
    "app.agent.reference_pool",
    "app.agent.suggestions",
    "app.agent.chat_draft",
    "app.agent.city_guide",
    "app.agent.clarify",
    "app.agent.critic",
    "app.agent.day_stream",
    "app.agent.day_prompts",
    "app.agent.grounding",
    "app.agent.graph_nodes",
    "app.agent.graph_state",
    "app.agent.open_plans",
    "app.agent.formatting.assembly",
    "app.agent.narrative",
    "app.agent.plan_context",
    "app.agent.day_workflow",
    "app.agent.formatting",
    "app.agent.function_calling",
    "app.agent.generation_core",
    "app.agent.generators",
    "app.agent.geo",
    "app.agent.intent",
    "app.agent.landing",
    "app.agent.local_replan",
    "app.agent.memory",
    "app.agent.nl_edit",
    "app.agent.observability",
    "app.agent.poi_repository",
    "app.agent.pricing",
    "app.agent.reflect",
    "app.agent.research",
    "app.agent.route_matrix",
    "app.agent.route_service",
    "app.agent.run_limits",
    "app.agent.schedule_optimizer",
    "app.agent.tool_registry",
    "app.agent.tools",
    "app.agent.trace",
    "app.agent.trace_store",
    "app.agent.trip_graph",
    "app.agent.trip_stream",
    "app.agent.usage_store",
    "app.agent.web_search",
    "app.agent.workflow",
]
