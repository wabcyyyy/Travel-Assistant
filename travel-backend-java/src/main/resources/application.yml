server:
  port: 8080
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: travel-backend-java
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:travel_assistant}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      connection-init-sql: SET NAMES utf8mb4
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: ${JWT_SECRET:}
    expire-hours: 24
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  agent:
    base-url: ${AGENT_SERVICE_URL:http://localhost:8000}
    internal-token: ${AGENT_INTERNAL_TOKEN:}
  amap:
    web-key: ${AMAP_WEB_KEY:}
  unsplash:
    access-key: ${UNSPLASH_ACCESS_KEY:}
  export:
    dir: ${EXPORT_DIR:data/export}

logging:
  level:
    com.travel: debug
