<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">行程单</title>
    <style type="text/css">
        /* ============================================================
           印刷版「随行刊物」：与站内视觉同源（墨绿 + 陶土 + 暖纸）。
           渲染约束：Flying Saucer + 单一嵌入字体 SimHei（CSS 2.1 子集），
           不支持 flex / 渐变 / 阴影——层级全部靠字号、留白、发丝线与实色块。
           ============================================================ */
        @page { size: A4; margin: 16mm 14mm; }
        body { font-family: SimHei, sans-serif; font-size: 11px; color: #14181f; line-height: 1.6; }

        /* ---------- 刊头：实色墨绿底 + 陶土细条（无渐变，印刷安全） ---------- */
        .masthead { background: #0b2927; color: #fffdf8; padding: 20px 22px 16px; margin-bottom: 14px; }
        .mast-brand { margin: 0 0 8px; font-size: 9px; letter-spacing: 0.3em; color: #9dc3be; }
        .mast-title { font-size: 22px; margin: 0 0 2px; color: #fffdf8; }
        .mast-city { font-size: 13px; color: #f2c4a8; margin: 0 0 10px; }
        .mast-rule { border: none; border-top: 2px solid #bd6246; margin: 0 0 10px; width: 64px; }
        .meta { color: rgba(255, 253, 248, 0.78); font-size: 10px; }
        .meta span { display: inline-block; margin: 0 8px 4px 0; padding: 2px 8px; border: 1px solid rgba(255, 253, 248, 0.30); border-radius: 8px; }

        /* ---------- 逐日跨页：左缘青绿条 + 陶土序数 + 发丝线表格 ---------- */
        .day { border: 1px solid #d8dfda; border-left: 3px solid #0f766e; border-radius: 6px; margin-bottom: 12px; page-break-inside: avoid; }
        .day-head { padding: 9px 12px 2px; }
        .day-no { font-size: 13px; font-weight: bold; color: #0c2e2c; }
        .day-date { font-size: 10px; color: #5c6470; }
        .day-theme { padding: 3px 12px 0; color: #bd6246; font-weight: bold; font-size: 12px; }
        .day-note { padding: 5px 12px 0; color: #3d4451; }
        .day-notes { margin: 4px 0 0; padding: 0 12px 0 24px; color: #5c6470; font-size: 10px; }
        .day-notes li { margin-bottom: 2px; }
        .day-guide { padding: 0 12px 6px; color: #6f695f; font-size: 10px; }

        table { width: 100%; border-collapse: collapse; margin-top: 6px; }
        th, td { border: 1px solid #e2e6e4; padding: 4px 8px; text-align: left; vertical-align: top; }
        th { background: #eef2f0; color: #0c2e2c; font-size: 10px; }
        td { font-size: 10.5px; }
        .item-why td { color: #6f695f; font-size: 10px; border: none; padding-top: 0; }

        /* ---------- 预算附录：暖纸底 + 陶土左缘（勘误栏符号） ---------- */
        .budget { border: 1px solid #d8dfda; border-left: 3px solid #bd6246; border-radius: 6px; margin-top: 12px; page-break-inside: avoid; }
        .budget-title { background: #f6f0e4; color: #0c2e2c; padding: 6px 12px; font-weight: bold; }
        .total { text-align: right; padding: 6px 12px; font-weight: bold; color: #0c2e2c; }

        .colophon { text-align: center; color: #5c6470; margin-top: 16px; font-size: 9.5px; line-height: 1.7; }
    </style>
</head>
<body>

<!-- 刊头：期名 = 行程标题，刊名 = 目的地，期号 = 日期与人数 -->
<div class="masthead">
    <p class="mast-brand">TRAVEL FIELD HANDBOOK</p>
    <h1 class="mast-title" th:text="${title}">行程单</h1>
    <p class="mast-city" th:text="${city}">目的地</p>
    <hr class="mast-rule"/>
    <div class="meta">
        <span th:if="${days}" th:text="${days} + ' 天 ' + ${persons} + ' 人'">天数</span>
        <span th:if="${startDate}" th:text="${startDate} + ' ~ ' + ${endDate}">日期</span>
        <span th:if="${preferences}" th:text="'偏好：' + ${preferences}">偏好</span>
        <span th:if="${budget}" th:text="'预算上限 ￥' + ${budget}">预算</span>
    </div>
</div>

<!-- 逐日跨页 -->
<div class="day" th:each="day : ${dayList}">
    <div class="day-head">
        <span class="day-no" th:text="'第 ' + ${day['dayNo']} + ' 天'">第 1 天</span>
        <span class="day-date" th:if="${day['travelDate']}" th:text="'（' + ${day['travelDate']} + '）'">（日期）</span>
    </div>
    <!-- M3-③：当日主题叙事句标题；提示列表逐条渲染；均用括号取值防 Map 缺键崩溃 -->
    <div class="day-theme" th:if="${day['theme'] != null}" th:text="${day['theme']}">当日主题叙事句</div>
    <div class="day-note" th:if="${day['note']}" th:text="${day['note']}">备注</div>
    <ul class="day-notes" th:if="${day['practicalNotes'] != null}">
        <li th:each="tip : ${day['practicalNotes']}" th:text="${tip}">出发前提醒</li>
    </ul>
    <div class="day-guide" th:if="${day['backupPlan'] != null}">
        <span th:if="${day['backupPlan']}" th:text="'备选：' + ${day['backupPlan']}">备选</span>
    </div>
    <table>
        <thead>
        <tr>
            <th>类型</th>
            <th>名称</th>
            <th>时间</th>
            <th>时长(分)</th>
            <th>费用(￥)</th>
            <th>开放/来源</th>
            <th>备注</th>
        </tr>
        </thead>
        <tbody>
        <!-- 来源由 Java 侧预映射为用户化标签（typeLabel/srcLabel），不在印刷品上外露内部编码 -->
        <th:block th:each="item : ${day['items']}">
        <tr>
            <td th:text="${item['typeLabel']}">类型</td>
            <td th:text="${item['poiName']}">名称</td>
            <td th:text="(${item['startTime']} != null ? ${item['startTime']} : '') + (${item['endTime']} != null ? ' - ' + ${item['endTime']} : '')">时间</td>
            <td th:text="${item['durationMin']}">0</td>
            <td th:text="${item['cost']}">0</td>
            <td><span th:if="${item['openTime'] != null}" th:text="'开放：' + ${item['openTime']}">开放</span><br th:if="${item['openTime'] != null and item['source'] != null}"/><span th:if="${item['source'] != null}" th:text="'来源：' + ${item['srcLabel']}">来源</span></td>
            <td th:text="${item['remark']}">备注</td>
        </tr>
        <!-- M3-③：叙事理由次级行，缺键/为空不占版面；不加前缀标签，直接呈现正文 -->
        <tr class="item-why" th:if="${item['whyThis'] != null}">
            <td th:colspan="7" th:text="${item['whyThis']}">为什么选这里</td>
        </tr>
        </th:block>
        </tbody>
    </table>
</div>

<!-- 预算附录 -->
<div class="budget">
    <div class="budget-title">预算附录（人民币估算）</div>
    <table>
        <thead>
        <tr>
            <th>分类</th>
            <th>金额</th>
            <th>项目数</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${budgetList}">
            <td th:text="${b['category']}">分类</td>
            <td th:text="${b['amount']}">0</td>
            <td th:text="${b['itemCount']}">0</td>
        </tr>
        </tbody>
    </table>
    <div class="total" th:text="'合计：￥' + ${totalAmount}">合计</div>
</div>

<!-- 版权页脚 -->
<div class="colophon">
    本刊由 Travel Assistant 排印生成 · 价格均为人民币估算，请以现场或官方渠道为准<br/>
    出发前请再次确认各点位营业时间与票价
</div>
</body>
</html>
