server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Agent 内部面（/api/agent/**、/mcp）不在前端调用清单里，也接受调用方自备 user_id，
    # 绝不该从边缘可达：只允许直连内网端口 + X-Agent-Token（R1-8）。
    location /api/agent/ {
        deny all;
        return 403;
    }

    location /mcp {
        deny all;
        return 403;
    }

    location /api/ {
        # 后端统一到 FastAPI（M7-b）：业务端点 + agent 面同一个服务。
        # SSE 不需要在这里关缓冲：Python 侧的事件响应自带 `X-Accel-Buffering: no`。
        proxy_pass http://agent-python:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 必须**替换**而不是追加（$proxy_add_x_forwarded_for 会把客户端自带的
        # X-Forwarded-For 留在链首，那一段永远是可伪造的）。后端 app.common.client_ip
        # 按可信网段从右往左取跳，配的网段要与 docker-compose 里的 TRUSTED_PROXIES 一致。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
